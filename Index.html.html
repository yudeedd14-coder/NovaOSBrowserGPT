<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NovaOS — Web Computer</title>
<style>
:root{--accent:#8b7cff;--glass:rgba(19,24,43,.84);--line:rgba(255,255,255,.15);--text:#f4f6ff;--muted:#a7b0c8}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);background:#080b16}
button,input,textarea,select{font:inherit}button{cursor:pointer;color:inherit}
.desktop{position:relative;width:100%;height:100%;overflow:hidden;background:radial-gradient(ellipse at 15% 20%,#286b94 0,transparent 30%),radial-gradient(ellipse at 80% 18%,#6146a8 0,transparent 32%),radial-gradient(ellipse at 65% 85%,#143f78 0,transparent 38%),linear-gradient(135deg,#08182c,#14142e 65%,#070b17)}
.desktop:before{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 35%,#ffffff05 35.2%,transparent 65%),radial-gradient(ellipse at 50% 110%,#9a7cff1c,transparent 45%);pointer-events:none}
.topbar{height:34px;position:absolute;top:0;left:0;right:0;background:#070a12a8;backdrop-filter:blur(18px);display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-size:12px;z-index:10;border-bottom:1px solid #ffffff10}
.topleft,.topright{display:flex;align-items:center;gap:13px}.brandmini{font-weight:800;letter-spacing:.4px}.brandmini span{color:#b5a6ff}
.desktop-icons{position:absolute;top:54px;left:14px;display:grid;grid-template-columns:76px;gap:14px;z-index:1}.deskicon{width:74px;border:0;background:transparent;border-radius:13px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:6px;text-shadow:0 2px 5px #000a}.deskicon:hover{background:#ffffff17}.ico{width:45px;height:45px;border-radius:14px;display:grid;place-items:center;font-size:24px;background:linear-gradient(145deg,#ffffff28,#ffffff0b);border:1px solid #ffffff2b;box-shadow:0 7px 20px #0003}.deskicon small{font-size:11px;text-align:center}
.window{position:absolute;z-index:3;left:50%;top:50%;transform:translate(-50%,-50%);width:min(850px,calc(100vw - 34px));height:min(570px,calc(100dvh - 110px));min-height:260px;background:rgba(14,18,31,.94);border:1px solid #ffffff26;border-radius:17px;box-shadow:0 28px 90px #0009;backdrop-filter:blur(28px);overflow:hidden;display:flex;flex-direction:column}
.window.hidden{display:none}.titlebar{height:43px;flex-shrink:0;display:flex;align-items:center;padding:0 12px;background:#ffffff08;border-bottom:1px solid #ffffff12;gap:10px;user-select:none}.traffic{display:flex;gap:6px}.traffic button{width:11px;height:11px;border:0;border-radius:50%;padding:0}.close{background:#ff625d}.min{background:#ffc04c}.max{background:#35c96d}.win-title{font-size:12px;color:#cbd2e7;flex:1;text-align:center;margin-right:46px}.winbody{flex:1;min-height:0;overflow:auto}.winbody.no-scroll{overflow:hidden}
.dockwrap{position:absolute;z-index:8;bottom:12px;left:50%;transform:translateX(-50%);max-width:calc(100vw - 20px);padding:8px;border:1px solid #ffffff29;background:#111727b8;backdrop-filter:blur(24px);border-radius:22px;box-shadow:0 12px 45px #0007}.dock{display:flex;gap:7px;align-items:end}.dock button{width:48px;height:48px;border:0;border-radius:14px;background:#ffffff0e;display:grid;place-items:center;font-size:25px;transition:transform .14s,background .14s}.dock button:hover{transform:translateY(-5px);background:#ffffff20}.dock button.running:after{content:"";position:absolute;margin-top:59px;width:4px;height:4px;border-radius:50%;background:#c6baff}
.panel{padding:22px}.panel h1{font-size:25px;margin:0 0 5px}.muted{color:var(--muted);font-size:13px}.storegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-top:18px}.appcard{padding:15px;border:1px solid #ffffff16;border-radius:15px;background:#ffffff08;display:flex;gap:12px;align-items:center}.appicon{width:48px;height:48px;flex-shrink:0;border-radius:14px;display:grid;place-items:center;font-size:25px;background:linear-gradient(145deg,#ffffff23,#ffffff08);border:1px solid #ffffff1c}.appcard strong{font-size:13px}.appcard p{margin:5px 0;color:#9da7bf;font-size:11px;line-height:1.4}.appcard button,.primary{border:0;border-radius:9px;padding:7px 12px;background:var(--accent);color:#100d22;font-size:12px;font-weight:800}.appcard .appmeta{flex:1;min-width:0}.installed{background:#283146!important;color:#cbd3e7!important}
.browser{height:100%;display:flex;flex-direction:column}.browserbar{display:flex;gap:8px;padding:10px;border-bottom:1px solid #ffffff12;align-items:center}.browserbar button{border:1px solid #ffffff16;background:#ffffff0a;border-radius:9px;padding:7px 10px}.address{flex:1;min-width:0;background:#090e19;border:1px solid #ffffff19;color:white;border-radius:10px;padding:10px 12px;outline:none}.browserhint{padding:10px 14px;background:#8b7cff12;border-bottom:1px solid #8b7cff22;color:#c9c0ff;font-size:11px;line-height:1.4}.browserview{flex:1;min-height:0;background:#fff}.browserview iframe{width:100%;height:100%;border:0;background:white}.browserstart{height:100%;overflow:auto;color:#eef0ff;background:radial-gradient(ellipse at 50% 0,#34315c,#101625 58%);padding:clamp(18px,5vw,50px);text-align:center}.browserstart h1{font-size:clamp(28px,5vw,44px);margin:22px 0 8px}.websearch{max-width:550px;display:flex;gap:8px;margin:25px auto}.websearch input{flex:1;min-width:0;border:1px solid #ffffff25;border-radius:13px;padding:14px;background:#ffffff12;color:white;outline:none}.websearch button{border:0;border-radius:13px;background:var(--accent);color:#110d26;padding:0 17px;font-weight:800}.quicklinks{display:flex;justify-content:center;flex-wrap:wrap;gap:9px}.quicklinks button{background:#ffffff0e;border:1px solid #ffffff19;border-radius:12px;padding:11px 14px}
.notes{width:100%;height:100%;display:flex;flex-direction:column;padding:15px;gap:10px}.notes input{background:#ffffff0b;border:1px solid #ffffff17;color:white;padding:11px;border-radius:9px}.notes textarea{flex:1;resize:none;min-height:100px;background:#ffffff08;border:1px solid #ffffff17;color:white;border-radius:10px;padding:13px;outline:none}.calc{max-width:310px;margin:20px auto;padding:18px;background:#090e19;border:1px solid #ffffff14;border-radius:20px}.calcdisplay{height:65px;text-align:right;font-size:30px;padding:15px 5px;overflow:hidden}.calcgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.calcgrid button{height:48px;border:0;border-radius:13px;background:#20283a;font-size:17px}.calcgrid button.op{background:#6e5bcb}.calcgrid button.eq{background:#a391ff;color:#100d22}
.settingslist{padding:20px;display:grid;gap:10px}.settingrow{display:flex;align-items:center;justify-content:space-between;gap:15px;background:#ffffff08;border:1px solid #ffffff13;border-radius:13px;padding:15px}.settingrow input[type=color]{width:38px;height:32px;border:0;background:none}.settingrow select{background:#171d2b;color:white;border:1px solid #ffffff22;padding:8px;border-radius:8px}
.files{padding:22px}.filelist{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px;margin-top:15px}.fileitem{background:#ffffff09;border:1px solid #ffffff13;border-radius:14px;padding:16px;text-align:center}.fileitem div{font-size:28px;margin-bottom:8px}.fileitem small{color:#a7b0c8}
.toast{position:absolute;z-index:20;left:50%;bottom:90px;transform:translateX(-50%);padding:11px 15px;border:1px solid #ffffff20;border-radius:12px;background:#151c2c;box-shadow:0 8px 30px #0007;font-size:12px;display:none;max-width:90%}
.startmenu{position:absolute;z-index:9;bottom:80px;left:50%;transform:translateX(-50%);width:min(390px,calc(100vw - 22px));background:#101625ed;backdrop-filter:blur(25px);border:1px solid #ffffff25;border-radius:22px;padding:18px;box-shadow:0 20px 60px #0008;display:none}.startmenu.show{display:block}.starttop{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.startapps{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.startapps button{background:transparent;border:0;border-radius:12px;padding:10px 3px;display:flex;align-items:center;flex-direction:column;gap:6px;font-size:11px}.startapps button:hover{background:#ffffff12}.startapps span{font-size:25px}
@media(max-width:600px){.desktop-icons{top:48px;left:6px;grid-template-columns:64px;gap:7px}.deskicon{width:62px;padding:5px 2px}.ico{width:39px;height:39px;font-size:21px}.window{top:47%;width:calc(100vw - 18px);height:calc(100dvh - 160px);min-height:230px}.dock button{width:42px;height:42px;font-size:22px}.dockwrap{bottom:7px}.topbar{padding:0 9px}.panel{padding:17px}.storegrid{grid-template-columns:1fr 1fr}.appcard{padding:10px;gap:8px}.appicon{width:39px;height:39px;font-size:21px}.appcard p{display:none}.appcard button{padding:7px 9px}}
</style></head>
<body><div class="desktop" id="desktop">
<div class="topbar"><div class="topleft"><span class="brandmini">✦ <span>NovaOS</span></span><span id="activeLabel">Desktop</span></div><div class="topright"><span>◈ Online</span><span id="clock">9:41</span><span>▰</span></div></div>
<div class="desktop-icons" id="desktopIcons"></div>
<div class="window hidden" id="window"><div class="titlebar"><div class="traffic"><button class="close" onclick="closeWindow()" aria-label="Close"></button><button class="min" onclick="minimizeWindow()" aria-label="Minimize"></button><button class="max" onclick="maximizeWindow()" aria-label="Maximize"></button></div><div class="win-title" id="winTitle">App</div></div><div class="winbody" id="winbody"></div></div>
<div class="startmenu" id="startmenu"><div class="starttop"><strong>✦ NovaOS Apps</strong><button onclick="openApp('store')" class="primary">App Store</button></div><div class="startapps" id="startapps"></div></div>
<div class="dockwrap"><div class="dock" id="dock"></div></div><div class="toast" id="toast"></div>
</div>
<script>
const catalog=[
{id:'browser',name:'Web Browser',icon:'🌐',desc:'Search the web and visit websites.',kind:'browser',built:true},
{id:'store',name:'App Store',icon:'🛍️',desc:'Install mini-apps into NovaOS.',kind:'store',built:true},
{id:'notes',name:'Notes',icon:'📝',desc:'Write notes saved in this browser.',kind:'notes',built:true},
{id:'calculator',name:'Calculator',icon:'🧮',desc:'A handy on-screen calculator.',kind:'calculator',built:true},
{id:'files',name:'Files',icon:'📁',desc:'A simple virtual file shelf.',kind:'files',built:true},
{id:'settings',name:'Settings',icon:'⚙️',desc:'Personalize your desktop.',kind:'settings',built:true},
{id:'music',name:'Music Player',icon:'🎵',desc:'Open a music streaming website.',kind:'link',url:'https://music.youtube.com',built:false},
{id:'paint',name:'Pixel Paint',icon:'🎨',desc:'A tiny drawing pad in your browser.',kind:'paint',built:false},
{id:'calendar',name:'Calendar',icon:'📅',desc:'View today and make a simple event list.',kind:'calendar',built:false},
{id:'timer',name:'Focus Timer',icon:'⏱️',desc:'A simple focus countdown timer.',kind:'timer',built:false},
{id:'weather',name:'Weather Web',icon:'🌤️',desc:'Open a weather website.',kind:'link',url:'https://www.weather.com',built:false},
{id:'games',name:'Mini Games',icon:'🕹️',desc:'Open a collection of web games.',kind:'link',url:'https://poki.com',built:false}
];
let installed=['browser','store','notes','calculator','files','settings'];try{const saved=JSON.parse(localStorage.getItem('nova-installed'));if(Array.isArray(saved))installed=[...new Set(['browser','store','settings',...saved])]}catch(e){}
let currentApp=null,prevRect=null,isMax=false,notesTitle='',calcExpr='',timerInterval=null;
const $=id=>document.getElementById(id);
function persist(){try{localStorage.setItem('nova-installed',JSON.stringify(installed))}catch(e){}}
function getApp(id){return catalog.find(a=>a.id===id)}
function installedApps(){return installed.map(getApp).filter(Boolean)}
function renderDesktop(){let apps=installedApps();$('desktopIcons').innerHTML=apps.slice(0,7).map(a=>`<button class="deskicon" ondblclick="openApp('${a.id}')" onclick="selectDesktop('${a.id}')"><span class="ico">${a.icon}</span><small>${a.name}</small></button>`).join('');$('dock').innerHTML=apps.slice(0,7).map(a=>`<button title="${a.name}" class="${currentApp===a.id?'running':''}" onclick="openApp('${a.id}')">${a.icon}</button>`).join('');$('startapps').innerHTML=apps.map(a=>`<button onclick="openApp('${a.id}');toggleStart(false)"><span>${a.icon}</span>${a.name}</button>`).join('')}
function selectDesktop(id){$('activeLabel').textContent=getApp(id)?.name||'Desktop'}
function openApp(id){const app=getApp(id);if(!app)return;if(!installed.includes(id)){toast('Install '+app.name+' from the App Store first.');return}currentApp=id;isMax=false;$('window').style.cssText='';$('window').classList.remove('hidden');$('winTitle').textContent=app.icon+'  '+app.name;$('activeLabel').textContent=app.name;const body=$('winbody');body.className='winbody';body.innerHTML=renderApp(app);renderDesktop();if(id==='browser')browserInit();if(id==='notes')notesInit();if(id==='calculator')calcInit();if(id==='paint')paintInit();if(id==='calendar')calendarInit();if(id==='timer')timerInit();if(id==='settings')settingsInit();if(id==='store')renderStore()}
function closeWindow(){$('window').classList.add('hidden');currentApp=null;$('activeLabel').textContent='Desktop';renderDesktop();if(timerInterval){clearInterval(timerInterval);timerInterval=null}}
function minimizeWindow(){$('window').classList.add('hidden')}
function maximizeWindow(){let w=$('window');if(!isMax){prevRect={left:w.style.left,top:w.style.top,width:w.style.width,height:w.style.height,transform:w.style.transform,borderRadius:w.style.borderRadius};w.style.left='8px';w.style.top='42px';w.style.width='calc(100% - 16px)';w.style.height='calc(100% - 126px)';w.style.transform='none';w.style.borderRadius='14px';isMax=true}else{w.style.cssText='';isMax=false}}
function renderApp(a){switch(a.kind){case'store':return `<div class="panel"><h1>App Store</h1><p class="muted">Install apps into your NovaOS desktop. These are mini web apps, not native iPhone applications.</p><div class="storegrid" id="storegrid"></div></div>`;
case'browser':return `<div class="browser"><div class="browserbar"><button onclick="browserBack()">‹</button><button onclick="browserHome()">⌂</button><input class="address" id="address" placeholder="Search or enter a website address" onkeydown="if(event.key==='Enter')navigateWeb()"><button onclick="navigateWeb()">Go ↗</button><button onclick="externalCurrent()">↗</button></div><div class="browserhint">Some websites block being shown inside another page. If a site does not load here, use ↗ to open it in a new tab.</div><div class="browserview" id="browserview"><div class="browserstart"><div style="font-size:42px">🌐</div><h1>Explore the web</h1><p class="muted">Search for something or open a favorite site.</p><form class="websearch" onsubmit="event.preventDefault();let q=document.getElementById('webq').value;document.getElementById('address').value=q;navigateWeb()"><input id="webq" placeholder="Search the web…" aria-label="Search the web"><button>Search</button></form><div class="quicklinks"><button onclick="goUrl('https://www.wikipedia.org')">Wikipedia</button><button onclick="goUrl('https://www.youtube.com')">YouTube</button><button onclick="goUrl('https://www.google.com')">Google</button><button onclick="goUrl('https://poki.com')">Games</button></div></div></div></div>`;
case'notes':return `<div class="notes"><input id="noteTitle" placeholder="Note title"><textarea id="noteText" placeholder="Start typing… your notes save automatically."></textarea><div class="muted" id="notesStatus">Saved on this device</div></div>`;
case'calculator':return `<div style="padding:15px"><div class="calc"><div class="calcdisplay" id="calcdisplay">0</div><div class="calcgrid">${['AC','±','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','0','.','⌫','='].map(k=>`<button class="${['÷','×','−','+'].includes(k)?'op':''} ${k==='='?'eq':''}" onclick="calcPress('${k}')">${k}</button>`).join('')}</div></div></div>`;
case'files':return `<div class="files"><h1>Files</h1><p class="muted">A virtual shelf for this demo. It does not browse your iPhone's private files.</p><div class="filelist"><div class="fileitem"><div>📝</div><strong>Notes</strong><br><small>Saved in NovaOS</small></div><div class="fileitem"><div>📦</div><strong>Installed Apps</strong><br><small>${installed.length} apps</small></div><div class="fileitem"><div>🌐</div><strong>Web Links</strong><br><small>Open in browser</small></div></div></div>`;
case'settings':return `<div class="panel"><h1>Settings</h1><p class="muted">Make NovaOS feel like yours.</p><div class="settingslist"><div class="settingrow"><span>Accent color</span><input type="color" id="accentColor" value="#8b7cff" onchange="setAccent(this.value)"></div><div class="settingrow"><span>Desktop wallpaper</span><select id="wallpaper" onchange="setWallpaper(this.value)"><option value="aurora">Aurora</option><option value="sunset">Violet sunset</option><option value="ocean">Deep ocean</option><option value="mono">Midnight</option></select></div><div class="settingrow"><span>Installed apps</span><strong>${installed.length}</strong></div><div class="settingrow"><span>Reset installed apps</span><button class="primary" onclick="resetApps()">Reset</button></div></div></div>`;
case'link':return `<div class="panel"><h1>${a.icon} ${a.name}</h1><p class="muted">This app opens an external website.</p><button class="primary" onclick="window.open('${a.url}','_blank','noopener')">Open website ↗</button>`;
case'paint':return `<div class="panel"><h1>Pixel Paint</h1><p class="muted">Draw with your finger or mouse.</p><div style="display:flex;gap:10px;align-items:center;margin:12px 0"><input type="color" id="paintColor" value="#9b7cff"><button class="primary" onclick="clearCanvas()">Clear</button></div><canvas id="paintCanvas" style="width:100%;height:calc(100% - 120px);min-height:180px;background:#fff;border-radius:12px;touch-action:none"></canvas></div>`;
case'calendar':return `<div class="panel"><h1>Calendar</h1><p class="muted" id="todayText"></p><form onsubmit="event.preventDefault();addEvent()" style="display:flex;gap:8px;margin:15px 0"><input id="eventInput" placeholder="Add a reminder…" style="min-width:0;flex:1;padding:12px;border-radius:10px;background:#0a0f1b;color:white;border:1px solid #ffffff22"><button class="primary">Add</button></form><div id="eventList"></div>`;
case'timer':return `<div class="panel" style="text-align:center"><h1>Focus Timer</h1><p class="muted">A simple focus session.</p><div id="timerDisplay" style="font-size:60px;font-weight:700;margin:45px 0 25px">25:00</div><div style="display:flex;justify-content:center;gap:10px"><button class="primary" onclick="startTimer()">Start</button><button class="primary" onclick="pauseTimer()">Pause</button><button class="primary" onclick="resetTimer()">Reset</button></div></div>`;
default:return `<div class="panel"><h1>${a.name}</h1><p class="muted">App installed successfully.</p></div>`}}
function renderStore(){let grid=$('storegrid');if(!grid)return;grid.innerHTML=catalog.map(a=>{let on=installed.includes(a.id);return `<div class="appcard"><div class="appicon">${a.icon}</div><div class="appmeta"><strong>${a.name}</strong><p>${a.desc}</p><button class="${on?'installed':''}" onclick="toggleInstall('${a.id}')">${on?(a.built?'Included':'Uninstall'):'Install'}</button></div></div>`}).join('')}
function toggleInstall(id){let a=getApp(id);if(a.built){toast('This is a core NovaOS app.');return}if(installed.includes(id)){installed=installed.filter(x=>x!==id);if(currentApp===id)closeWindow();toast(a.name+' uninstalled.')}else{installed.push(id);toast(a.name+' installed!')}persist();renderDesktop();renderStore()}
function resetApps(){if(!confirm('Reset NovaOS to its default installed apps?'))return;installed=['browser','store','notes','calculator','files','settings'];persist();renderDesktop();openApp('settings');toast('Apps reset.')}
function browserInit(){let v=$('browserview');if(!v)return;v.querySelectorAll('iframe').forEach(f=>{});}
function browserHome(){if($('address'))$('address').value='';$('browserview').innerHTML=`<div class="browserstart"><div style="font-size:42px">🌐</div><h1>Explore the web</h1><p class="muted">Search for something or open a favorite site.</p><form class="websearch" onsubmit="event.preventDefault();let q=document.getElementById('webq').value;document.getElementById('address').value=q;navigateWeb()"><input id="webq" placeholder="Search the web…"><button>Search</button></form><div class="quicklinks"><button onclick="goUrl('https://www.wikipedia.org')">Wikipedia</button><button onclick="goUrl('https://www.youtube.com')">YouTube</button><button onclick="goUrl('https://www.google.com')">Google</button><button onclick="goUrl('https://poki.com')">Games</button></div></div>`}
function normalizeUrl(q){q=q.trim();if(!q)return'https://www.google.com';if(/^https?:\/\//i.test(q))return q;if(/^[\w-]+\.[a-z]{2,}(\/.*)?$/i.test(q))return'https://'+q;return'https://www.google.com/search?q='+encodeURIComponent(q)}
function navigateWeb(){let q=$('address').value;let url=normalizeUrl(q);$('address').value=url;let view=$('browserview');view.innerHTML='';let frame=document.createElement('iframe');frame.src=url;frame.referrerPolicy='no-referrer';frame.title='Web page';view.appendChild(frame);window.lastWebUrl=url}
function goUrl(url){if($('address'))$('address').value=url;navigateWeb()}
function externalCurrent(){let u=$('address')?.value||window.lastWebUrl||'https://www.google.com';window.open(normalizeUrl(u),'_blank','noopener')}
function browserBack(){try{$('browserview').querySelector('iframe')?.contentWindow.history.back()}catch(e){toast('Browser history is limited by website security. Use the site’s own Back button.')} }
function notesInit(){let t=$('noteTitle'),v=$('noteText');t.value=localStorage.getItem('nova-note-title')||'';v.value=localStorage.getItem('nova-note-text')||'';const save=()=>{localStorage.setItem('nova-note-title',t.value);localStorage.setItem('nova-note-text',v.value);$('notesStatus').textContent='Saved just now'};t.oninput=save;v.oninput=save}
function calcInit(){calcExpr='';$('calcdisplay').textContent='0'}
function calcPress(k){let d=$('calcdisplay');if(k==='AC'){calcExpr='';d.textContent='0';return}if(k==='⌫'){calcExpr=calcExpr.slice(0,-1);d.textContent=calcExpr||'0';return}if(k==='='){try{let x=calcExpr.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-');if(!/^[0-9+*/().% -]+$/.test(x))throw 0;let result=Function('"use strict";return ('+x+')')();if(!Number.isFinite(result))throw 0;calcExpr=String(result);d.textContent=calcExpr}catch(e){d.textContent='Error';calcExpr=''}return}if(k==='±'){if(calcExpr.startsWith('-'))calcExpr=calcExpr.slice(1);else calcExpr='-'+calcExpr;d.textContent=calcExpr;return}calcExpr+=k;d.textContent=calcExpr}
function settingsInit(){let a=localStorage.getItem('nova-accent');if(a){$('accentColor').value=a;setAccent(a)}let w=localStorage.getItem('nova-wallpaper');if(w){$('wallpaper').value=w;setWallpaper(w)}}
function setAccent(c){document.documentElement.style.setProperty('--accent',c);localStorage.setItem('nova-accent',c)}
function setWallpaper(w){let b=$('desktop');let map={aurora:'radial-gradient(ellipse at 15% 20%,#286b94 0,transparent 30%),radial-gradient(ellipse at 80% 18%,#6146a8 0,transparent 32%),radial-gradient(ellipse at 65% 85%,#143f78 0,transparent 38%),linear-gradient(135deg,#08182c,#14142e 65%,#070b17)',sunset:'radial-gradient(ellipse at 20% 20%,#b34f82 0,transparent 35%),radial-gradient(ellipse at 80% 25%,#7555b7 0,transparent 35%),linear-gradient(135deg,#251331,#25184a,#0c1026)',ocean:'radial-gradient(ellipse at 25% 15%,#1f9b9d 0,transparent 35%),radial-gradient(ellipse at 75% 65%,#2051a1 0,transparent 40%),linear-gradient(135deg,#051e2b,#08152d)',mono:'radial-gradient(ellipse at 50% 0%,#303444,transparent 45%),linear-gradient(135deg,#08090d,#171923)'};b.style.background=map[w]||map.aurora;localStorage.setItem('nova-wallpaper',w)}
function paintInit(){let c=$('paintCanvas');if(!c)return;let r=c.getBoundingClientRect(),ratio=window.devicePixelRatio||1;c.width=r.width*ratio;c.height=r.height*ratio;let ctx=c.getContext('2d');ctx.scale(ratio,ratio);ctx.lineWidth=4;ctx.lineCap='round';let drawing=false;function point(e){let b=c.getBoundingClientRect();return{x:e.clientX-b.left,y:e.clientY-b.top}}c.onpointerdown=e=>{drawing=true;c.setPointerCapture(e.pointerId);let p=point(e);ctx.beginPath();ctx.moveTo(p.x,p.y)};c.onpointermove=e=>{if(!drawing)return;ctx.strokeStyle=$('paintColor').value;let p=point(e);ctx.lineTo(p.x,p.y);ctx.stroke()};c.onpointerup=()=>drawing=false;c.onpointercancel=()=>drawing=false}
function clearCanvas(){let c=$('paintCanvas');if(c)c.getContext('2d').clearRect(0,0,c.width,c.height)}
function calendarInit(){let now=new Date();$('todayText').textContent=now.toLocaleDateString(undefined,{weekday:'long',year:'numeric',month:'long',day:'numeric'});renderEvents()}
function renderEvents(){let ev=[];try{ev=JSON.parse(localStorage.getItem('nova-events')||'[]')}catch(e){}let el=$('eventList');if(el)el.innerHTML=ev.map((x,i)=>`<div class="settingrow" style="margin:7px 0"><span>📌 ${escapeHtml(x)}</span><button onclick="deleteEvent(${i})" style="background:#333b4c;border:0;border-radius:8px;padding:7px">×</button></div>`).join('')||'<p class="muted">No reminders yet.</p>'}
function addEvent(){let input=$('eventInput'),v=input.value.trim();if(!v)return;let ev=JSON.parse(localStorage.getItem('nova-events')||'[]');ev.push(v);localStorage.setItem('nova-events',JSON.stringify(ev));input.value='';renderEvents()}
function deleteEvent(i){let ev=JSON.parse(localStorage.getItem('nova-events')||'[]');ev.splice(i,1);localStorage.setItem('nova-events',JSON.stringify(ev));renderEvents()}
let timerLeft=1500;
function timerInit(){clearInterval(timerInterval);timerInterval=null;timerLeft=1500;updateTimer()}
function updateTimer(){let e=$('timerDisplay');if(e)e.textContent=String(Math.floor(timerLeft/60)).padStart(2,'0')+':'+String(timerLeft%60).padStart(2,'0')}
function startTimer(){if(timerInterval)return;timerInterval=setInterval(()=>{if(timerLeft>0){timerLeft--;updateTimer()}else{clearInterval(timerInterval);timerInterval=null;toast('Focus session complete!')}},1000)}
function pauseTimer(){clearInterval(timerInterval);timerInterval=null}function resetTimer(){pauseTimer();timerLeft=1500;updateTimer()}
function toggleStart(force){let s=$('startmenu');if(typeof force==='boolean')s.classList.toggle('show',force);else s.classList.toggle('show')}
function toast(msg){let t=$('toast');t.textContent=msg;t.style.display='block';clearTimeout(window.toastTimeout);window.toastTimeout=setTimeout(()=>t.style.display='none',2500)}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$('clock').textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});setInterval(()=>$('clock').textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),30000);
renderDesktop(); // Start button appears as a small OS launcher on the left side of dock
let startBtn=document.createElement('button');startBtn.textContent='✦';startBtn.title='NovaOS menu';startBtn.onclick=()=>toggleStart();startBtn.style.cssText='position:absolute;z-index:8;bottom:20px;left:15px;width:44px;height:44px;border-radius:14px;background:#171d30d9;border:1px solid #ffffff28;font-size:22px';$('desktop').appendChild(startBtn);
$('desktop').addEventListener('dblclick',e=>{if(e.target.id==='desktop')toggleStart()});
</script></body></html>
